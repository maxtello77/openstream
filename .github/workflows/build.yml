name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "===== GRADLE FAILURE — last 150 lines ====="
            tail -150 build.log
            echo "============================================"
            awk '/What went wrong|Could not resolve|FAILURE: Build failed/{f=1} f' build.log | head -40 | while IFS= read -r line; do
              echo "::error::[$RANDOM] ${line:0:220}"
            done
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenStream-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
